<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29366f">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Pixel Office</title>
<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
  :root { --bg: #e4eef6; --ink: #1a1c2c; --dim: #566c86; --bar: #29366f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans TC", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: var(--bar); color: #f4f4f4; font-size: 14px; }
  #stale { color: #ffcd75; display: none; }
  header { position: sticky; top: 0; z-index: 1; }
  main { min-height: calc(100% - 37px); }
  img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  #card { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: #f4f4f4; border-top: 3px solid var(--bar); box-shadow: 0 -4px 16px #0003; font-size: 15px; line-height: 1.6; display: none; }
  #card h2 { margin: 0 0 4px; font-size: 18px; }
  #card .k { color: var(--dim); display: inline-block; min-width: 4.5em; }
  #card .err { color: #b13e53; }
  #card #close { position: absolute; top: 8px; right: 12px; border: 0; background: none; font-size: 22px; color: var(--dim); }
  #card { max-height: 70%; overflow-y: auto; }
  #say { display: flex; gap: 8px; margin-top: 10px; }
  #say textarea { flex: 1; min-height: 2.6em; max-height: 8em; font: inherit; padding: 6px 8px; border: 1px solid var(--dim); border-radius: 6px; resize: vertical; }
  #say button { border: 0; border-radius: 6px; padding: 0 16px; background: var(--bar); color: #fff; font: inherit; }
  #say button:disabled { opacity: .5; }
  #sent { color: var(--dim); font-size: 13px; margin-top: 4px; }
  #reply { margin-top: 10px; border-top: 1px solid #ccd; padding-top: 8px; }
  #reply .head { color: var(--dim); font-size: 13px; }
  #reply .md { margin: 4px 0 0; max-height: 40vh; overflow-y: auto; word-break: break-word; font: 14px/1.5 system-ui, "Noto Sans TC", sans-serif; background: #fff; border-radius: 6px; padding: 8px; }
  #reply .md > :first-child { margin-top: 0; }
  #reply .md > :last-child { margin-bottom: 0; }
  #reply .md p, #reply .md ul, #reply .md ol, #reply .md pre, #reply .md table, #reply .md blockquote { margin: .4em 0; }
  #reply .md h1, #reply .md h2, #reply .md h3, #reply .md h4 { font-size: 15px; margin: .6em 0 .3em; }
  #reply .md ul, #reply .md ol { padding-left: 1.4em; }
  #reply .md blockquote { padding-left: 8px; border-left: 3px solid #ccd; color: var(--dim); }
  #reply .md code { font: 13px Consolas, "Cascadia Mono", monospace; background: #eef2f6; padding: 0 3px; border-radius: 3px; }
  #reply .md pre { background: var(--ink); color: #f4f4f4; padding: 8px; border-radius: 4px; overflow-x: auto; white-space: pre; word-break: normal; }
  #reply .md pre code { background: none; color: inherit; padding: 0; }
  #reply .md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; word-break: normal; }
  #reply .md th, #reply .md td { border: 1px solid #ccd; padding: 2px 6px; text-align: left; vertical-align: top; min-width: 3em; }
  #reply .md th { background: #eef2f6; }
  #reply pre.raw { white-space: pre-wrap; }
</style>
</head>
<body>
<header><span id="count">Pixel Office</span><span id="stale">Disconnected, frozen at <b id="at"></b></span></header>
<main><img id="scene" alt="Pixel Office"></main>
<div id="card"><button id="close" aria-label="Close">×</button><div id="info"></div>
  <div id="reply"></div>
  <form id="say"><textarea id="text" placeholder="Send a command (same as typing in its window)" enterkeyhint="send"></textarea><button id="send">Send</button></form>
  <div id="sent"></div></div>
<script>
  const img = document.getElementById('scene')
  const main = document.querySelector('main')
  const W = 64 // 手機直立用 64 單位寬：比 Desktop 窄，名牌才不會小到看不清
  let busy = false
  let lastOk
  let state
  let picked // 卡片開著的人（session id），每秒跟著更新
  async function tick() {
    if (busy || document.hidden) return
    busy = true
    try {
      const a = ((innerHeight - 37) / main.clientWidth).toFixed(2)
      const r = await fetch(`/scene.svg?w=${W}&a=${a}`, { cache: 'no-store' })
      if (!r.ok) throw new Error(r.status)
      const url = URL.createObjectURL(await r.blob())
      const old = img.src
      img.onload = () => { if (old.startsWith('blob:')) URL.revokeObjectURL(old) }
      img.src = url
      const s = state = await (await fetch('/state.json', { cache: 'no-store' })).json()
      if (picked) show(s.people.find(p => p.id === picked), true)
      const waiting = s.people.filter(p => p.mode === 'waiting').length
      document.getElementById('count').textContent = `${s.people.length} online` + (waiting ? ` · ${waiting} waiting for you` : '')
      document.getElementById('stale').style.display = 'none'
      lastOk = new Date()
    } catch {
      document.getElementById('at').textContent = lastOk ? lastOk.toLocaleTimeString() : '(never connected)'
      document.getElementById('stale').style.display = 'inline'
    } finally {
      busy = false
    }
  }
  // 回覆是 AI 寫的、頁面能從手機遠端開：轉出來的 HTML 一律過 DOMPurify；兩個檔沒載到就退回純文字
  const md = t => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t), { gfm: true, breaks: true })) : `<pre class="raw">${esc(t)}</pre>`
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago` }
  const CMD = { pending: 'sent, waiting for pickup', delivered: 'delivered', expired: 'not picked up in 10 min, discarded' }
  function show(p, refresh) {
    const card = document.getElementById('card')
    if (!p) { picked = undefined; card.style.display = 'none'; return }
    if (!refresh && picked !== p.id) document.getElementById('text').value = ''
    picked = p.id
    const rep = document.getElementById('reply')
    const body = rep.querySelector('.md')
    const keep = body && body.dataset.at === String(p.reply?.at) // 同一則回覆：不重畫，捲到哪就停在哪
    if (!keep) rep.innerHTML = p.reply
      ? `<div class="head">Latest reply (${ago(p.reply.at)})${p.reply.ask ? ` · to you: 📱 ${esc(p.reply.ask.slice(0, 40))}` : ''}</div><div class="md" data-at="${p.reply.at}">${md(p.reply.text)}</div>`
      : '<div class="head">No reply yet (needs 0.23.0+ and one finished turn)</div>'
    else rep.querySelector('.head').textContent = `Latest reply (${ago(p.reply.at)})` + (p.reply.ask ? ` · to you: 📱 ${p.reply.ask.slice(0, 40)}` : '')
    document.getElementById('sent').textContent = p.cmd ? `Last command: "${p.cmd.text.slice(0, 40)}" — ${CMD[p.cmd.state]} (${ago(p.cmd.at)})` : ''
    const row = (k, v) => v ? `<div><span class="k">${k}</span>${v}</div>` : ''
    document.getElementById('info').innerHTML =
      `<h2>${p.role === 'manager' ? '★ ' : ''}${esc(p.plate)}</h2>` +
      row('Title', p.title && esc(p.title)) +
      row('Status', esc(p.modeText) + (p.since ? ` (since ${ago(p.since)})` : '')) +
      row('Tool', p.tool && esc(p.tool)) +
      row('Approval', p.approval && esc(p.approval)) +
      row('Team', p.team && esc(p.team)) +
      row('Name', p.agent && esc(p.agent)) +
      (p.lastError ? `<div class="err"><span class="k">Error</span>${esc(p.lastError.text)} (${ago(p.lastError.at)})</div>` : '')
    card.style.display = 'block'
  }
  // 點圖：把點的位置換回圖上的座標，找最近的人
  img.addEventListener('click', ev => {
    if (!state) return
    const r = img.getBoundingClientRect()
    const k = Math.min(r.width / state.box.w, r.height / state.box.h)
    const x = (ev.clientX - r.left - (r.width - state.box.w * k) / 2) / k
    const y = (ev.clientY - r.top - (r.height - state.box.h * k) / 2) / k
    let best, d = 8
    for (const p of state.people) {
      if (p.x === undefined) continue
      const e = Math.hypot(p.x - x, p.y + 1.5 - y)
      if (e < d) { d = e; best = p }
    }
    show(best)
  })
  document.getElementById('close').addEventListener('click', () => show())
  document.getElementById('say').addEventListener('submit', async ev => {
    ev.preventDefault()
    const box = document.getElementById('text')
    const btn = document.getElementById('send')
    if (!picked || !box.value.trim()) return
    btn.disabled = true
    try {
      const r = await fetch('/command', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: picked, text: box.value }) })
      const j = await r.json().catch(() => ({}))
      if (r.ok) box.value = ''
      document.getElementById('sent').textContent = r.ok ? 'Sent, waiting for pickup' : `Not sent: ${j.error ?? r.status}`
    } catch {
      document.getElementById('sent').textContent = 'Not sent: cannot reach the computer'
    } finally {
      btn.disabled = false
    }
  })
  tick()
  setInterval(tick, 1000)
  document.addEventListener('visibilitychange', tick)
</script>
</body>
</html>
