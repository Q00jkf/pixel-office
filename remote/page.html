<style>
  /* v2（2026-11-22）：辦公室畫在 v2/scene.js 的 canvas 上（上方協作區、下方辦公區），點人直接開完整對話、點名牌開狀態卡。
     人事室（招聘、等你回覆、薪水單、排班、協作桌）、完整對話、換智力／打斷／解雇都在這一頁 */
  :root { --bg: #e4eef6; --ink: #1a1c2c; --dim: #566c86; --bar: #29366f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans TC", sans-serif; }

  header { position: sticky; top: 0; z-index: 1; }

  #hrbtn { border: 1px solid #ffcd75; border-radius: 6px; background: none; color: #ffcd75; font: inherit; padding: 2px 10px; cursor: pointer; }

  #hr:empty { display: none; }
  .chip { border: 1px solid var(--bar); border-radius: 14px; background: #fff; color: var(--bar); font: inherit; font-size: 13px; padding: 3px 10px; margin: 3px 4px 0 0; }
  .chip.on { background: var(--bar); color: #fff; }
  .chip.red { border-color: #b13e53; color: #b13e53; }
  .chip.redon { border-color: #b13e53; background: #b13e53; color: #fff; }
  .chip:disabled, .chip[aria-disabled] { opacity: .4; cursor: not-allowed; }

  .md > :first-child { margin-top: 0; }

  #menu .mbtn.go { text-align: center; background: var(--bar); color: #fff; }

  #chat .chwho b { font-size: 16px; }
  #chat #chstat { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chlog { flex: 1; overflow-y: auto; padding: 10px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #chlog .ctop, #chlog .cn { text-align: center; color: var(--dim); font-size: 12px; margin: 8px 0; }
  #chlog .cb { margin: 8px 0; max-width: 88%; word-break: break-word; font: 15px/1.55 system-ui, "Noto Sans TC", sans-serif; }
  #chlog .me { margin-left: auto; }
  #chlog .me .t { background: var(--bar); color: #fff; border-radius: 14px 14px 4px 14px; padding: 8px 12px; white-space: pre-wrap; }
  #chlog .me .im { margin-top: 4px; font-size: 13px; opacity: .85; }
  #chlog .me .tm { text-align: right; color: var(--dim); font-size: 11px; margin-top: 2px; }
  #chlog .ai { max-width: 100%; }
  #chlog .ai .md { background: #fff; border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 15px; line-height: 1.55; }
  #chlog .ct { margin: 2px 0; font-size: 12.5px; color: var(--dim); }
  #chlog .ct summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; cursor: pointer; }
  #chlog .ct summary b { font-weight: 600; color: #3b4a66; }
  #chlog .ct.run summary::after { content: ' ⏳'; }
  #chlog .ct.bad summary { color: #b13e53; } #chlog .ct.bad summary::after { content: ' ✗'; }
  #chlog .ct .lab { margin: 4px 0 2px; font-size: 11px; }
  #chlog .ct pre { margin: 0; max-height: 40vh; overflow: auto; background: #fff; border: 1px solid #ccd; border-radius: 6px; padding: 6px 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; color: var(--ink); }
  #chsay { display: flex; gap: 6px; padding: 8px 12px 4px; background: #f4f4f4; border-top: 1px solid #ccd; }
  #chsay textarea { flex: 1; min-height: 2.4em; max-height: 160px; font: 16px/1.4 system-ui, "Noto Sans TC", sans-serif; padding: 6px 10px; border: 1px solid var(--dim); border-radius: 16px; resize: none; }
  #chsay button { border: 0; border-radius: 16px; padding: 0 14px; background: var(--bar); color: #fff; font: inherit; font-size: 15px; }
  #chsay #chphoto { background: #fff; border: 1px solid var(--dim); color: inherit; padding: 0 10px; }
  #chsent { min-height: 1.2em; padding: 0 12px calc(6px + env(safe-area-inset-bottom)); background: #f4f4f4; color: var(--dim); font-size: 12px; }
  #ptoast { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); z-index: 8; max-width: calc(100% - 32px); background: var(--bar); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; display: none; }
  /* 首次載入畫面（0.63.46）：一張角色主視覺，素材載入期間蓋在畫面上，場景第一次畫好就淡出。不擋點擊（pointer-events: none） */
  #kvsplash { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; background: #2a1a0e; color: #fff6e6; pointer-events: none; transition: opacity .45s ease; }
  #kvsplash.out { opacity: 0; }
  #kvsplash .kvf { position: relative; width: 100%; max-width: 560px; aspect-ratio: 16 / 9; }
  #kvsplash .kvf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .6s ease; }
  #kvsplash .kvf img.on { opacity: 1; }
  #kvsplash .kvt { font: 600 20px/1.3 system-ui, "Noto Sans TC", sans-serif; text-align: center; }
  #kvsplash .kvt small { display: block; margin-top: 4px; font-weight: 400; font-size: 13px; opacity: .75; }
  @media (prefers-reduced-motion: reduce) { #kvsplash, #kvsplash .kvf img { transition: none; } }
</style>

<body>
<div id="kvsplash"><div class="kvf"><img alt=""></div><div class="kvt" role="status" aria-live="polite">像素辦公室<small>載入中…</small></div></div>
<script>
// 首次載入畫面（0.63.46；審查 kv 修正）：每次開頁隨機一位角色的主視覺小圖（kv_splash_<角色>_sm.webp，約 60 KB）。
// 只載這一張，低優先、開頁就載：場景前段（scene.js、manifest、state）多是等來回、頻寬空著，小圖用那段空檔。
// 實測（冷快取、80 ms、220 KB/s、390 寬）：場景就緒比擋掉這張慢約 0.25 秒；改成等首批場景圖請求發出後才載反而慢 0.38 秒（跟桌子大圖搶）。
// 其他三張不載（場景好了畫面就收掉，看不到）。
// 這張載不到就換下一位角色試，都不行只剩字。場景第一次畫好（po:scene-ready）淡出移除；最多 20 秒也收掉。不擋點擊。
;(() => {
  const box = document.getElementById('kvsplash'), im = box.querySelector('img')
  const SRC = { claude: '/v2/assets/kv_splash_claude_sm.webp', chatgpt: '/v2/assets/kv_splash_chatgpt_sm.webp', gemini: '/v2/assets/kv_splash_gemini_sm.webp', deepseek: '/v2/assets/kv_splash_deepseek_sm.webp' }
  const order = Object.keys(SRC), k = Math.floor(Math.random() * order.length), tries = [...order.slice(k), ...order.slice(0, k)]
  let fails = 0, cap = 0
  const tryNext = () => { if (fails < tries.length) { im.fetchPriority = 'low'; im.src = SRC[tries[fails]] } }
  im.onload = () => im.classList.add('on')
  im.onerror = () => { fails++; tryNext() }
  const done = () => {
    clearTimeout(cap); removeEventListener('po:scene-ready', done)
    im.onload = im.onerror = null; if (!im.complete) im.removeAttribute('src') // 還沒到的圖不再等
    box.classList.add('out'); setTimeout(() => box.remove(), 500)
  }
  tryNext()
  addEventListener('po:scene-ready', done, { once: true })
  cap = setTimeout(done, 20000)
})()
</script>

<script>
;(() => {
  // ---------- 共用：狀態每秒拿一次，大家共用（場景、卡片、人事室、完整對話） ----------
  // 網址帶 ?demo=N：用 N 位示意同事（伺服器產生）取代真資料；所有送出都擋下，只有換座位、改協作桌會改「示意」座位表
  const q = new URLSearchParams(location.search)
  const demoN = q.has('demo') ? Math.max(0, Math.min(400, Number(q.get('demo')) || 0)) : -1
  const DEMO = demoN >= 0
  const $ = id => document.getElementById(id)
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  // 回覆是 AI 寫的、頁面能從手機遠端開：轉出來的 HTML 一律過 DOMPurify；兩個檔沒載到就退回純文字
  const md = t => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t), { gfm: true, breaks: true })) : `<pre class="raw">${esc(t)}</pre>`
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? '剛剛' : m < 60 ? `${m} 分鐘前` : `${Math.round(m / 60)} 小時前` }
  const MODE = { idle: '閒著', thinking: '思考中', typing: '正在寫', reading: '正在讀', waiting: '等你回覆／核准', done: '剛做完', blocked: '卡住了' }
  const KIND = { codex: 'Codex', agy: 'agy' }
  // 模型・投入程度・模式（2026-11-24 像素顧問定案、使用者確認）：選項以伺服器給的為準（state.efforts／perms／codex*），沒給就用這組
  const EFFORTS = [{ v: 'low', name: '低' }, { v: 'medium', name: '中' }, { v: 'high', name: '高' }, { v: 'xhigh', name: '很高' }, { v: 'max', name: '最高' }]
  // 投入程度每級一行說明（顧問 11-25 定的字；伺服器給的選單沒附說明時用這份，Codex 只列它有的級數）
  const EFFDESC = { minimal: '幾乎不多想，最快', low: '最快、最省，簡單的事', medium: '平常用', high: '想得比較多', xhigh: '難題，較慢、較花用量', max: '最難的題目，最慢、最花用量', ultra: '比最高更慢、更花用量，留給真的很難的題目' }
  const PERMS = [{ v: 'auto', name: '自動', desc: 'Claude 處理權限決策' }, { v: 'default', name: '手動', desc: '進行變更前一律先詢問' },
    { v: 'acceptEdits', name: '接受編輯', desc: '自動接受所有檔案編輯' }, { v: 'plan', name: '規劃', desc: '進行變更前先建立計畫' }]
  /** p.kind＝codex 時，model（slug）決定投入程度清單：codexModels[i].efforts 有給就只列那幾個 */
  function cfgOpts(p, model) {
    const s0 = st || {}
    if (p && p.kind === 'codex') {
      const cm = s0.codexModels || [], mm = model || p.model, m = cm.find(x => x.slug === mm) || cm.find(x => x.name === mm), all = s0.codexEfforts || []
      // 工程師B 0.63.22：員工身上的 efforts＝它目前模型支援的級數（codexModels 只列前四款），先用它；招聘（有帶 model）照 codexModels
      const own = !model && Array.isArray(p.efforts) ? p.efforts : null
      const models = cm.map(x => ({ v: x.slug, name: x.name }))
      if (!model && p.model && !m) models.unshift({ v: p.model, name: p.model }) // 清單外的模型：列在最上面打勾，看得出現在用哪個
      return { models, efforts: own ? all.filter(e => own.includes(e.v)) : !m ? [] : m.efforts ? all.filter(e => m.efforts.includes(e.v)) : all, perms: s0.codexPerms || [] } // 複驗 5：不認得的模型不猜級數
    }
    return { models: Object.entries(s0.models || {}).map(([v, name]) => ({ v, name })), efforts: s0.efforts || EFFORTS, perms: s0.perms || PERMS }
  }
  /** 目前的模型（p.model 是顯示名，例如「Opus 5.5」或帶括號；比 v 或名字第一個字）、投入程度、模式；找不到回 undefined */
  function cfgNow(p) {
    const o = cfgOpts(p), w = x => String(x || '').split(/[\s（(]/)[0].toLowerCase()
    // 審查 13：先比 v（slug）、再比完整名稱；首字比對只給 Claude（四個模型首字都不同），Codex 多個 GPT-5.5* 會勾錯
    const model = !p.model ? undefined : o.models.find(m => m.v === p.model) || o.models.find(m => m.name === p.model)
      || (p.kind ? undefined : o.models.find(m => m.v === w(p.model) || w(m.name) === w(p.model)))
    return { o, model,
      effort: o.efforts.find(e => e.v === p.effort), perm: o.perms.find(m => m.v === p.perm) }
  }
  const listeners = []
  let st, lastOk, busy = false, picked // picked：卡片開著的人（session id），每秒跟著更新
  const people = () => (st ? st.people : [])
  const find = id => people().find(p => p.id === id)

  let tt
  // ---------- 動畫（2026-11-23，第 2、4 段）：開＝加 po-in；關＝加 po-out，0.18 秒後才真的藏起來；系統設「減少動態效果」就不動、不等 ----------

  // ---------- 員工卡兩層（2026-11-25 像素顧問定案、使用者交主管）：第一層狀態列＋最後說的話＋輸入＋打斷／完整對話＋三個入口；二級從右邊滑進來 ----------
  const PERMWHY = p => p.kind === 'codex' ? 'App 裡開的 Codex 要到 App 裡操作' : 'App 開的 Claude 要在 App 裡切模式'
  const APPONLY = 'App 裡開的 Codex 要到 App 裡操作'
  // 只能傳話的人（App 或終端機視窗開的 Codex、agy）：二級只寫一行「<哪裡>開的，只能傳話」，人事頁「…只能傳話、調部門」（使用者 11-25 定的字樣；顧問 11-25 補：照實際來源寫）
  const whereOf = p => p.kind === 'agy' ? 'agy 開的' : p.src === 'terminal' ? '終端機視窗開的' : p.src === 'app' || (!p.src && !p.ctl) ? 'App 裡開的' : '這位'
  const RELOAD = '這位的對話還沒載入新版像素辦公室外掛：在那個對話裡打 /reload-plugins（或重開對話），就能從這裡換智力、模式、打斷、整理記憶'
  const OPS = ['model', 'effort', 'perm', 'key', 'fire']
  /**
   * 審查 14：每個操作能不能做、不能的理由（''＝可以）。
   * 後端有給 p.can（{ model, effort, perm, key, fire }: boolean）、p.why（同鍵的理由，all＝共用）就照它，不再用 !ctl 猜「App 裡開的」；
   * 沒給（舊伺服器）先照舊推論：Claude 看 ctl／permCtl，Codex 看 ctl
   */
  function capOf(p) {
    if (p.can) { const w = p.why || {}; return Object.fromEntries(OPS.map(op => [op, p.can[op] ? '' : w[op] || w.all || '這位現在不能從手機操作'])) }
    const c = {}
    for (const op of OPS) c[op] = !p.kind ? (op === 'fire' ? '' : p.ctl ? '' : RELOAD) : p.kind === 'codex' ? (p.ctl ? '' : APPONLY) : '這位不能從手機操作'
    if (!p.kind && p.ctl && p.permCtl === false) c.perm = PERMWHY(p)
    return c
  }
  /** 只能傳話（Codex、agy 每項都不能操作）：第一層不列灰掉的打斷，二級只寫一行，不列灰掉的按鈕 */
  const talkOnly = (p, cap) => (p.kind === 'codex' || p.kind === 'agy') && OPS.every(op => cap[op])
  /** 來源：後端給 p.src 就照它；沒給照舊 */
  function srcText(p) {
    const cx = p.kind === 'codex'
    if (p.src) return ({ tmux: cx ? 'Codex・在電腦背景跑' : '在電腦背景跑', app: cx ? '開在 ChatGPT／Codex App 裡' : '從 Claude app 開的', terminal: '在電腦的終端機視窗裡', other: '在電腦視窗裡', unknown: '還判斷不出開在哪' })[p.src] || p.src
    return { app: '從 Claude app 開的', tmux: '在電腦背景跑', other: '在電腦視窗裡', unknown: '', codex: p.ctl ? 'Codex・在電腦背景跑' : '開在 ChatGPT／Codex App 裡', agy: 'agy' }[p.host] || ''
  }
  /**
   * Codex 交給 App／接回後台（2026-11-25 使用者定案；伺服器工程師B 0.63.28）：回 { to, label, why } 或 null（不顯示）
   * 看 p.can.handoffApp（tmux 開的 → 交給 App）、p.can.handoffTmux（App 開的 → 接回後台）；不能時理由在 p.why 同名鍵
   */
  function handoffOf(p) {
    if (p.kind !== 'codex' || !p.can) return null
    const w = p.why || {}, one = (k, to, label) => ({ to, label, why: p.can[k] ? '' : w[k] || w.all || '現在不能換' })
    // 先看哪個是 true；都不是時，只有後端給了原因（暫時不能）才照來源列出停用的那顆，其他人（兩個都 false、沒原因）不顯示
    if (p.can.handoffApp) return one('handoffApp', 'app', '📱 交給 App')
    if (p.can.handoffTmux) return one('handoffTmux', 'tmux', '🖥 接回後台')
    // 審查 14：只有共用的 why.all 時也要停用並說原因（例如 App 還開著這段、握著寫入鎖）
    if (p.src === 'tmux' && (w.handoffApp || w.all)) return one('handoffApp', 'app', '📱 交給 App')
    if (p.src === 'app' && (w.handoffTmux || w.all)) return one('handoffTmux', 'tmux', '🖥 接回後台')
    return null
  }
  const ck = on => on ? ' on' : ''
  const dk = w => w ? ` aria-disabled="true" data-why="${esc(w)}"` : ''

  // 二級：sub＝{ kind: 'cfg'|'hr'|'talk', id }；arm＝按兩次的動作（clear／fire）或手動確認（manual）；subSeq 換頁就加一（晚到的回應靠它判斷）
  let sub = null, arm = '', subSeq = 0, subKey = '', c1Top = 0
  const SUBT = { cfg: '🧠 智力與模式', hr: '👔 人事', talk: '🛠 對話' }
  const SUBH = { home: '⚙ 設定', ...SUBT } // 完整對話右上 ⚙ 進來的那一頁（11-26 定案 A）
  function openSub(kind) {
    const card = $('card')
    if (!sub) c1Top = card.scrollTop
    sub = { kind, id: picked }; arm = ''; subSeq++; subKey = ''
    $('c1').hidden = true; $('c2').hidden = false; card.scrollTop = 0

  }
  // 從完整對話的 ⚙ 開的（fromChat）：三頁返回到「設定」，設定再返回＝關卡片、回完整對話
  let fromChat = false
  function openSettings(p) {

    show(p); fromChat = true; $('card').classList.add('overchat')

  }
  $('c2back').addEventListener('click', () => { if (fromChat && sub) { if (sub.kind === 'home') show(); else openSub('home') } else closeSub(true) })
  $('close2').addEventListener('click', () => show())

  // /model、/perm、/effort 要等伺服器確認（1～4 秒）：按的那列顯示「確認中…」、整頁按鈕停用；同時只送一個；回應時頁面換了就只更新資料
  let cfgPending = '' // 審查 16：員工卡交接、智力與模式、離線（在 App 裡）入口共用這一把；值＝送出中那位的 id
  const reqLock = id => { if (cfgPending) { toast('上一個還在確認，等一下再按'); return false } cfgPending = id || '1'; return true }
  const reqUnlock = () => { cfgPending = '' }
  const reqBusy = () => !!cfgPending
  async function cfgPost(p, path, body, el) {
    if (cfgPending) { toast('上一個還在確認，等一下再按'); return }
    const box = $('c2body'), n0 = subSeq, tip = document.createElement('small'), btns = [...box.querySelectorAll('button, select')]
    cfgPending = p.id; btns.forEach(b => { b.disabled = true })
    if (el) { tip.className = 'busy'; tip.textContent = '確認中…'; (el.querySelector('span') || el).appendChild(tip) }
    let j
    try { j = await post(path, { id: p.id, ...body }) } finally { cfgPending = ''; btns.forEach(b => { b.disabled = false }); tip.remove() }
    toast(`${p.plate}：${j.text || j.error || '沒有回應'}`)
    if (subSeq !== n0 || !sub || sub.id !== p.id) { load(); return }
    arm = ''; subKey = ''; await load() // 留在這頁，打勾跟著新值移
  }

  /** 第一層的狀態列：「正在寫・Opus・中・自動・記憶 40%」；待核准、錯誤另起一行警示 */
  function statLine(p) {
    const c = cfgNow(p)
    const parts = [MODE[p.mode] || p.modeText || p.mode, c.model ? c.model.name.split(' ')[0] : p.model ? String(p.model).split(' ')[0] : '', c.effort && c.effort.name, c.perm && c.perm.name, p.ctx != null ? `記憶 ${p.ctx}%` : '']
    return `<div class="cstat">${esc(parts.filter(Boolean).join('・'))}</div>` +

  // ---------- 第一層的按鈕區（#hr）：⏸ 打斷、💬 完整對話、交給 App／接回後台、三個入口 ----------
  const hr = $('hr')
  let hrKey = '', hoAsk = null, hoBusy = '' // hoAsk＝{ id, to }：正在問「要打斷嗎」的那位與方向（審查 15）；hoBusy＝送出中的那位
  async function hoPost(p, to, interrupt, el) {
    if (cfgPending) { toast('上一個還在確認，等一下再按'); return }
    const btns = [...hr.querySelectorAll('button')]
    const gen0 = cardGen
    cfgPending = p.id; hoBusy = p.id; btns.forEach(b => { b.disabled = true })
    const t0 = el && el.textContent; if (el) el.textContent = '確認中…'
    let j
    try { j = await post('/codex-handoff', { id: p.id, to, ...(interrupt ? { interrupt: true } : {}) }) }
    finally { cfgPending = ''; hoBusy = ''; btns.forEach(b => { b.disabled = false }); if (el) el.textContent = t0 }
    if (picked !== p.id || cardGen !== gen0) { toast(`${p.plate}：${j.text || j.error || (j.need === 'interrupt' ? '他還在做事，沒有交接' : '沒有回應')}`); load(); return } // 等回應時換了人、或關掉又重開：不替新卡片開確認
    if (j.need === 'interrupt' && !interrupt) { hoAsk = { id: p.id, to }; hrKey = ''; drawHr(); return }
    hoAsk = null; hrKey = ''
    toast(`${p.plate}：${j.text || j.error || '沒有回應'}`)
    await load()
  }
  function drawHr() {
    const p = picked && find(picked)
    if (!p) { hr.innerHTML = ''; hrKey = ''; closeSub(); return }
    if (sub && sub.id !== p.id) closeSub()
    drawSub()
    const cap = capOf(p), app = talkOnly(p, cap), ho = handoffOf(p)
    if (hoAsk && (hoAsk.id !== p.id || !ho || ho.to !== hoAsk.to || ho.why)) hoAsk = null // 換人、方向變了、不能交了：確認作廢
    const key = [p.id, p.kind, JSON.stringify(cap), app, JSON.stringify(ho), JSON.stringify(hoAsk)].join('|')
    if (key === hrKey || (hoBusy && hoBusy === p.id)) return
    hrKey = key
    // App 開的 Codex：第一層只留完整對話（不能打斷，不列灰掉的鈕）；其他人不能打斷時灰掉、點了說原因
    hr.innerHTML = `<div class="g2${app ? ' one' : ''}">${app ? '' : `<button class="chip"${cap.key ? dk(cap.key) : ' data-k="esc"'}>⏸ 打斷</button>`}<button class="chip prim" data-p="chat">💬 完整對話</button></div>` +
      (!ho ? '' : hoAsk
        ? `<div class="hoask"><b>他還在做事，要打斷嗎？</b><span>${ho.to === 'app' ? '交給 App 要等他收尾，最多約半分鐘' : ''}</span></div><div class="g2"><button class="chip red" data-ho-yes>打斷並${ho.to === 'app' ? '交給 App' : '接回後台'}</button><button class="chip" data-ho-no>算了</button></div>`
        : `<div class="g2 one"><button class="chip ho"${ho.why ? dk(ho.why) : ` data-ho="${ho.to}"`}>${ho.label}</button></div>`) +
      Object.entries(SUBT).map(([k, t]) => `<button class="hsel" data-sub="${k}"><span class="v">${t}</span></button>`).join('')
    hr.querySelectorAll('[data-ho]').forEach(b => b.addEventListener('click', () => hoPost(p, b.dataset.ho, false, b)))

    hr.querySelectorAll('[data-ho-yes]').forEach(b => b.addEventListener('click', () => hoPost(p, askTo, true, b)))
    hr.querySelectorAll('[data-ho-no]').forEach(b => b.addEventListener('click', () => { hoAsk = null; hrKey = ''; drawHr() }))
    hr.querySelectorAll('[data-why]').forEach(b => b.addEventListener('click', () => toast(b.dataset.why)))
    hr.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => openSub(b.dataset.sub)))
    hr.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', async () => { const j = await post('/key', { id: p.id, key: b.dataset.k }); toast(j.text || '沒有回應') }))
    hr.querySelectorAll('[data-p="chat"]').forEach(b => b.addEventListener('click', () => openChat(p)))
  }

  // ---------- 二級內容 ----------
  function drawSub() {
    if (!sub) return
    const p = find(sub.id)
    if (!p) { closeSub(); return }
    if (cfgPending) return // 確認中不重畫（保住「確認中…」）
    const cap = capOf(p), app = talkOnly(p, cap), claude = !p.kind, cx = p.kind === 'codex'
    const key = [sub.kind, arm, p.model, p.effort, p.perm, p.switching, p.effortSwitching, p.permSwitching, p.role, p.team, p.title, p.tool, p.agent, p.src, p.host, JSON.stringify(cap), JSON.stringify(handoffOf(p)), people().filter(x => x.role === 'manager').map(x => x.agent + x.id).join(',')].join('|')
    if (key === subKey) return
    subKey = key
    $('c2title').textContent = SUBH[sub.kind].replace(/^\S+\s/, '')
    const body = $('c2body'), line = t => `<div class="note">${esc(t)}</div>`
    if (sub.kind === 'home') {
      body.innerHTML = Object.entries(SUBT).map(([k, t]) => `<button class="hsel" data-sub="${k}"><span class="v">${t}</span></button>`).join('')
      body.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => openSub(b.dataset.sub)))
      return
    }
    let h = ''
    if (sub.kind === 'cfg') {
      if (app) h = line(whereOf(p) + '，只能傳話')
      else {
        const c = cfgNow(p), nm = (l, v) => (l.find(e => e.v === v) || {}).name || v
        const sw = [p.switching && `模型切換中 → ${p.switching}`, p.effortSwitching && `投入程度切換中 → ${nm(c.o.efforts, p.effortSwitching)}`, p.permSwitching && `模式切換中 → ${nm(c.o.perms, p.permSwitching)}`].filter(Boolean)
        if (arm === 'manual') {
          // 切到「手動」前先提醒：Claude 每個動作都停；Codex 照它自己的說明；在哪按允許照後端回報的來源
          const bg = p.src ? p.src === 'tmux' : p.host === 'tmux' || (cx && p.ctl)
          const dm = c.o.perms.find(m => m.v === 'default') || {}
          h = `<div class="mcard warn"><i class="ico warn"></i><div><b>切到「${esc(dm.name || '手動')}」？</b><span>${cx ? esc(dm.desc || '動作會停下來等你按允許') + '。' : '他每個動作都會停下來等你按允許。'}${bg ? '開在電腦背景，可以在手機替他按允許。' : '開在 App 或其他視窗，要到那個視窗按允許。'}</span></div></div>` +
            `<button class="mbtn go" id="pmyes">確定切換</button><button class="mbtn" id="pmno">算了</button>`

    // 只能看（灰卡、App 裡的 Codex）：輸入框、照片收起，指向「接回後台」
    $('chsay').hidden = ro
    const RO_T = p.away ? '在 App 裡關掉的 Codex 只能看；要從這裡傳話，先按上面的「接回後台」' : 'App 裡開的 Codex 只能看；要從這裡傳話，先按上面的「接回後台」'
    if (ro && !$('chsent').dataset.err && $('chsent').textContent !== RO_T) $('chsent').textContent = RO_T
    drawLive(p)
    if (!p.away) drawAsk(p); else { $('chask').hidden = true; chat.askKey = '' }
    const sent = $('chsent')
    const st1 = !ro && p.cmd && Date.now() - p.cmd.at < 10 * 60000 && !sent.dataset.err ? `「${p.cmd.text.slice(0, 30)}」${{ pending: '已送出，等它收', delivered: '它收到了', expired: '10 分鐘沒被收，作廢了' }[p.cmd.state] || ''}` : null
    if (st1 !== null && sent.textContent !== st1) sent.textContent = st1
  }
  // ---------- 正在寫（B1，GET /live.json）：只對開著的這一頁每秒問一次；伺服器同一位 0.7 秒內只擷取一次 ----------
  // 有半段文字就顯示（最多 2000 字、捲到最後）；沒有 tmux pane（App、agy、終端機）的 writing 是 null，只寫「正在寫…」
  async function liveTick() {
    const me = chat
    if (!me || me.liveBusy || document.hidden) return
    const p = find(me.id)
    if (!p || !/^(thinking|typing|reading)$/.test(p.mode)) { me.live = null; return }
    me.liveBusy = true
    let j; try { j = await (await fetch(`/live.json?id=${encodeURIComponent(me.id)}`, { cache: 'no-store' })).json() } catch { j = null } finally { me.liveBusy = false }
    if (chat !== me) return
    me.live = j && j.ok && (j.state === 'writing' || j.state === 'tool') && j.writing ? j.writing : null
    drawLive(p)
  }
  function drawLive(p) {
    const box = $('chlive'), on = !p.away && /^(thinking|typing|reading)$/.test(p.mode)
    box.hidden = !on
    if (!on) { box.classList.remove('txt'); return }
    const t = chat.live
    if (t) {
      if (box.dataset.t !== t) { box.dataset.t = t; box.textContent = t; box.classList.add('txt'); box.scrollTop = box.scrollHeight }
    } else {
      const h = `${MODE[p.mode]}…`
      if (box.textContent !== h) { box.textContent = h; box.dataset.t = '' }
      box.classList.remove('txt')
    }
  }
  // ---------- 卡在允許（B5，伺服器工程師B phone-approve）：照 approvalInfo.options 出按鈕 ----------
  // 一定有「到電腦上看」（只說明、不送）；允許鍵從卡出現（at）算 1 秒後才能按；按下鎖「處理中…」，等卡消失或 nonce 換了才解鎖，5 秒還在就說「還沒處理到」並解鎖
  // 拒絕可以附原因（選填，最多 300 字）；不做「以後都允許」。舊伺服器只有 approval 字串：照舊只顯示內容、請到電腦上按
  const APPWHERE = p => p.kind === 'codex' ? 'ChatGPT／Codex App' : p.kind === 'agy' ? 'agy 視窗' : '電腦上的 Claude'
  function drawAsk(p) {
    const box = $('chask'), info = p.approvalInfo
    if (!p.approval && !info) { box.hidden = true; box.innerHTML = ''; chat.askKey = ''; chat.ask = null; return }
    box.hidden = false
    const nonce = info ? info.nonce : ''
    // 按過的那張：卡消失或換了 nonce 就解鎖（上面 return 已處理消失）；同一張超過 5 秒還在＝還沒處理到
    if (chat.ask && chat.ask.nonce === nonce && chat.ask.at && Date.now() - chat.ask.at > 5000) { chat.ask = null; chat.askKey = ''; toast('還沒處理到，請到電腦上看') }
    if (chat.ask && chat.ask.nonce !== nonce) chat.ask = null
    const opts = info && Array.isArray(info.options) ? info.options : []
    // 允許鍵 1 秒後才能按：從卡出現（at）與這張第一次畫到這頁上，取晚的那個算
    if (nonce && !(chat.seen || (chat.seen = {}))[nonce]) chat.seen[nonce] = Date.now()
    const wait = info ? Math.max(0, Math.max(info.at || 0, (chat.seen && chat.seen[nonce]) || 0) + 1000 - Date.now()) : 0
    const cd = askLeft(info), cdEl = box.querySelector('.askcd')
    if (cdEl && cdEl.textContent !== cd) cdEl.textContent = cd // 倒數只換這一行，不整塊重畫（拒絕原因、焦點不受影響）
    const key = [p.approval, JSON.stringify(info || null), chat.ask ? 'busy' : '', wait > 0].join('|')
    if (key === chat.askKey) return
    chat.askKey = key
    if (wait > 0) setTimeout(() => { if (chat) { chat.askKey = ''; chatStatus() } }, wait + 30)
    const desc = info ? String(info.desc || '') : String(p.approval)
    const long = desc.length > 160 || desc.split('\n').length > 4
    const btn = o => {
      if (chat.ask) return `<button type="button" class="chip" disabled>${chat.ask.key === o.key ? '處理中…' : esc(o.label)}</button>`
      if (o.key === 'allow' && wait > 0) return `<button type="button" class="chip" disabled>${esc(o.label)}</button>`
      return `<button type="button" class="chip${o.key === 'allow' ? ' prim' : ''}" data-ak="${esc(o.key)}">${esc(o.label)}</button>`
    }
    // 審查 K-1：整塊重畫（冷卻結束、送出失敗、卡片內容更新）前，留住拒絕原因的字、焦點與游標位置，畫完放回
    const old = box.querySelector('.askwhy'), keep = old && { v: old.value, f: document.activeElement === old, a: old.selectionStart, b: old.selectionEnd }
    box.innerHTML = `<div class="mcard warn"><i class="ico warn"></i><div><b>等你允許${info && info.tool ? `：${esc(info.tool)}` : ''}</b>` +
      (long ? `<details class="askd"><summary>${esc(desc.slice(0, 80))}…</summary><pre>${esc(desc)}</pre></details>` : `<span class="askd1">${esc(desc)}</span>`) +
      (info && info.reason ? `<span class="askr">理由：${esc(info.reason)}</span>` : '') +
      (cd ? `<span class="askr askcd" role="timer">${cd}</span>` : '') + '</div></div>' +
      (info && info.why ? `<div class="note">${esc(info.why)}</div>` : '') +
      (!opts.length && !(info && /請到/.test(info.why || '')) ? `<div class="note">請到 ${APPWHERE(p)} 按</div>` : '') + // why 已經寫「請到電腦按」（已交回電腦、手機核准沒開）就不重複
      `<div class="g2">${opts.map(btn).join('')}<button type="button" class="chip" data-ak-pc>到電腦上看</button></div>` +
      (opts.some(o => o.key === 'deny') && !chat.ask ? `<input class="askwhy" maxlength="300" placeholder="拒絕的原因（選填）" aria-label="拒絕的原因（選填）">` : '')
    const nw = box.querySelector('.askwhy')
    if (nw && keep) { nw.value = keep.v; if (keep.f) { nw.focus(); try { nw.setSelectionRange(keep.a, keep.b) } catch {} } }
    // 審查 K-1b：處理中那版沒有輸入框（keep 是空的）：原因另外記在 chat.askWhy（照這張的 nonce），送出失敗重畫時放回
    else if (nw && chat.askWhy && chat.askWhy.n === nonce) nw.value = chat.askWhy.v
    if (nw) nw.addEventListener('input', () => { chat.askWhy = { n: nonce, v: nw.value } })
    box.querySelectorAll('[data-ak-pc]').forEach(b => b.addEventListener('click', () => toast(`請到 ${APPWHERE(p)} 看這張，按完這裡會自己消失`)))
    box.querySelectorAll('[data-ak]').forEach(b => b.addEventListener('click', async () => {
      if (chat.ask) return
      const k = b.dataset.ak, why = (box.querySelector('.askwhy') || {}).value || ''
      chat.askWhy = { n: nonce, v: why } // K-1b：處理中那版不放輸入框，先記下來
      const me = chat; chat.ask = { nonce, key: k, at: 0 }; chat.askKey = ''; drawAsk(p)
      let j; try { j = await post('/approve', { id: p.id, key: k, nonce, ...(k === 'deny' && why.trim() ? { reason: why.trim().slice(0, 300) } : {}) }) } catch { j = { ok: false, text: '連不到電腦' } }
      toast(j.text || j.error || '沒有回應')
      if (chat !== me) return
      if (!j.ok) chat.ask = null; else if (chat.ask) chat.ask.at = Date.now() // 成功：等卡消失（最多 5 秒）
      chat.askKey = ''; await load(); chatStatus()
    }))
  }
  function reopen() {
    if (!chat) return
    const id = chat.id
    clearInterval(chat.timer)
    chat = { id, sid: '', start: 0, end: 0, tools: new Map(), orphans: new Map(), busy: false, key: '', askKey: '', hoAsk: '' }
    clog.innerHTML = ''; $('chnew').hidden = true
    chat.timer = setInterval(() => { newer(); chatStatus(); liveTick() }, 1000) // 開著那一頁每秒拿新的（B1：1～2 秒內出現）
    older(true)
  }
  function openChat(p) {
    if (!p) return
    show()
    if (chat) clearInterval(chat.timer)
    chat = { id: p.id }
    $('chname').textContent = `${p.role === 'manager' ? '★ ' : ''}${p.plate}`
    $('chsent').textContent = ''; delete $('chsent').dataset.err
    // Q 版大頭（D）：放大約兩倍，貼狀態列左下、頭探進標題列；名牌與狀態列左邊讓到小人實際寬度
    const ch = $('chchibi'), cu = window.PO_KV ? window.PO_KV.chibi(p.species) : ''
    ch.onload = () => { const w = ch.naturalHeight ? Math.min(96, Math.round(100 * ch.naturalWidth / ch.naturalHeight)) : 96; cv.style.setProperty('--kvw', (12 + w + 6) + 'px') }
    ch.onerror = () => { ch.hidden = true; cv.classList.remove('kvon') }
    if (cu && ch.getAttribute('src') !== cu) ch.src = cu
    ch.hidden = !cu; cv.classList.toggle('kvon', !!cu)
    pop(cv, 'flex')
    reopen()
    chatStatus()
  }
  function closeChat() { if (chat) clearInterval(chat.timer); chat = null; if (fromChat) show(); unpop(cv, () => { if (!chat) clog.innerHTML = '' }) }
  $('chback').addEventListener('click', closeChat)
  $('chcfg').addEventListener('click', () => { const p = chat && find(chat.id); if (p) openSettings(p); else toast(chat && awayOf(chat.id) ? '在 App 裡的 Codex 先接回後台才能設定' : '這位已經不在線') })
  $('chnew').addEventListener('click', () => { clog.scrollTop = clog.scrollHeight; $('chnew').hidden = true })
  clog.addEventListener('scroll', () => {
    if (clog.scrollTop < 60) older(false)
    if (clog.scrollHeight - clog.scrollTop - clog.clientHeight < 80) $('chnew').hidden = true
  })
  const ctext = $('chtext')
  ctext.addEventListener('input', () => { ctext.style.height = 'auto'; ctext.style.height = Math.min(ctext.scrollHeight, 160) + 'px' })
  const chSay = t => { $('chsent').textContent = t }
  $('chsay').addEventListener('submit', async ev => {
    ev.preventDefault()
    if (!chat || !ctext.value.trim()) return
    const btn = $('chsend'), sent = $('chsent'), ctx = chatCtx()
    if (!sendLock('chat')) return
    btn.disabled = true
    let j
    try { j = await post('/command', { id: ctx.id, text: ctx.text }) } finally { btn.disabled = false; sendUnlock('chat') }
    if (!chatStill(ctx)) { toast(j.ok ? j.text || '已送出，等它收' : j.unsure ? `不確定有沒有收到：${j.error}` : `沒送出：${j.error || j.text || '連不到電腦'}`); return }
    if (j.ok) { if (clearIfSame(ctext, ctx)) ctext.style.height = 'auto'; delete sent.dataset.err; sent.textContent = j.text || '已送出，等它收' }
    else { sent.dataset.err = '1'; sent.textContent = j.unsure ? `不確定有沒有收到：${j.error}` : `沒送出：${j.error || j.text || '連不到電腦'}`; setTimeout(() => delete sent.dataset.err, 5000) }
  })
  $('chphoto').addEventListener('click', () => { if (chat) askPhoto(chSay, () => ({ ...chatCtx(), box: ctext }), chatStill, 'chat') })

  // 給 v2/scene.js（場景、人事室、協作桌）用的
  window.PO = {
    demo: DEMO, demoN, esc, md, toast, post, choosePhoto, sendLock, sendUnlock, reqLock, reqUnlock, reqBusy, cfgOpts, EFFORTS, PERMS, sheet, sheetId, LOADING, pop, unpop, isOn, RM, closeSheet, show, openChat, openAwayChat: id => { const p = awayOf(id); if (p) openChat(p); else toast('這位已經不在 App 清單上') }, openHire, openQueue, openPay, openShift, openProfile, load,
    state: () => st, people, find, onState: f => { listeners.push(f); if (st) f(st) },
  }
  load()
  setInterval(load, 1000)
  document.addEventListener('visibilitychange', load)
})()
</script>
<script src="/v2/scene.js"></script>
</body>
